# Hardening: folder upload foto tidak boleh mengeksekusi script.
# Aplikasi menerima upload tanpa validasi tipe file, jadi tanpa ini file *.php yang
# diunggah ke assets/img/ bisa dijalankan lewat URL.
<Directory /var/www/html/assets/img>
    php_admin_flag engine off
    <FilesMatch "\.(php[0-9s]?|phtml|phar|pl|py|cgi|sh)$">
        Require all denied
    </FilesMatch>
    Options -ExecCGI -Indexes
</Directory>
