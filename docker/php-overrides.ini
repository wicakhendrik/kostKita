; Override PHP untuk KostKita
upload_max_filesize = 10M
post_max_size       = 12M
; Jangan tampilkan notice/warning ke pengunjung (kode lama banyak "undefined index"),
; tapi tetap catat ke stderr supaya terbaca lewat `docker compose logs`.
display_errors = Off
log_errors     = On
error_log      = /dev/stderr
error_reporting = E_ALL & ~E_NOTICE & ~E_WARNING & ~E_DEPRECATED
date.timezone  = Asia/Jakarta
